name: DMG para macOS

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como versión (crea la etiqueta v<versión de package.json> y la Release)'
        type: boolean
        default: false
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas
        run: npm test

      - name: 'Construir DMG (universal: Apple Silicon + Intel)'
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Comprobar el DMG
        run: |
          ls -lh release/*.dmg
          hdiutil verify release/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Posavasos-dmg
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Versión
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publicar en Releases (etiquetas v* o lanzamiento manual con «publicar»)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
        uses: softprops/action-gh-release@v2
        with:
          # En un lanzamiento manual la etiqueta se crea sobre el commit compilado.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Posavasos ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          generate_release_notes: true
          files: release/*.dmg
